[project]
name = "mini-support-agent"
version = "0.1.0"
description = "Beginner workshop: a Pydantic AI + Gemini support agent and an MCP server sharing one order-lookup tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-ai-slim[google]>=2.60,<3",
    "mcp[cli]>=2.3,<3",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.17",
]

[project.scripts]
support-agent = "mini_support_agent.agent:main"
order-mcp-server = "mini_support_agent.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live Gemini tests cost API quota, so they only run when asked for: pytest -m live
addopts = "-m 'not live'"
markers = ["live: calls the real Gemini API (needs GEMINI_API_KEY in .env)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
